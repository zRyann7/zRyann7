name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats SVGs
        uses: jstrieb/github-stats@v1.4.0
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: zRyann7
          EXCLUDED: "" 
          EXCLUDED_LANGS: "HTML,CSS"
          COUNT_STATS_FROM_FORKS: "false"

      - name: Commit generated SVGs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add generated/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update github stats svgs"
          git push